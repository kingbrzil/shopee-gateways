<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecionando para a Shopee...</title>
    <script>
    setTimeout(function() {
      var ua = navigator.userAgent.toLowerCase(),
          isAndroid = /android/i.test(ua),
          isIOS = /iphone|ipad|ipod/i.test(ua),
          aff = "https://shope.ee/an_redir?origin_link=https%3A%2F%2Fshopee.com.br%2Fproduct%2F1087752745%2F22897553802",
          intentUrl = "intent://shopee.com.br/product/1087752745/22897553802#Intent;scheme=https;package=com.shopee.br;S.browser_fallback_url=https%3A%2F%2Fshope.ee%2Fan_redir%3Forigin_link%3Dhttps%253A%252F%252Fshopee.com.br%252Fproduct%252F1087752745%252F22897553802;end",
          iosUrl = "shopee://product/1087752745/22897553802";
          
      if(isAndroid) {
          window.location.href = intentUrl;
          setTimeout(function(){ window.location.href = aff; }, 1500);
      } else if(isIOS) {
          window.location.href = iosUrl;
          setTimeout(function(){ window.location.href = aff; }, 1500);
      } else {
          window.location.href = aff;
      }
    }, 100);
    </script>
</head>
<body><p>Redirecionando para a Shopee...</p></body>
