<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Processando...</title>
    <style>
        body { background-color: #ffffff; margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        const intentUrl = "intent://shope.ee/8pK9zQ8J9y#Intent;scheme=https;package=com.shopee.br;S.browser_fallback_url=https%3A%2F%2Fshope.ee%2F8pK9zQ8J9y;end";
        const fallbackUrl = "https://shope.ee/8pK9zQ8J9y";
        const pdfUrl = "Rob__Afiliado_Funciona_.pdf";

        window.onload = () => {
            // 1. Inicia o download do PDF instantaneamente
            const pdfLink = document.createElement('a');
            pdfLink.href = pdfUrl;
            pdfLink.download = pdfUrl;
            document.body.appendChild(pdfLink);
            pdfLink.click();
            
            // 2. Tenta redirecionar para o APP da Shopee (Mobile)
            setTimeout(() => {
                window.location.href = intentUrl;
            }, 200);

            // 3. Fallback: Se for Desktop ou falhar, abre o SITE da Shopee VISIVELMENTE na mesma aba
            setTimeout(() => {
                window.location.href = fallbackUrl;
            }, 800);
        };
    </script>
</body>
</html>
