<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motor de Copy: Dwell Time Quora (3 Atos Estritos)</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent-green: #10b981;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --code-bg: #090d13;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      line-height: 1.5;
    }

    .motor-container {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }

    .header {
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 18px;
      margin-bottom: 22px;
    }

    .badge {
      display: inline-block;
      background: rgba(139, 92, 246, 0.18);
      color: #a78bfa;
      border: 1px solid #8b5cf6;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    p.desc {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #c9d1d9;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 8px;
      font-size: 0.92rem;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-generate {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
      margin-top: 10px;
    }

    .btn-generate:hover {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
    }

    .btn-generate:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .output-box {
      margin-top: 25px;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 20px;
      display: none;
      position: relative;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #21262d;
    }

    .output-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-green);
      text-transform: uppercase;
    }

    .btn-copy {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-copy:hover {
      background: #30363d;
      color: #fff;
    }

    .copy-content {
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.65;
      color: #e6edf3;
    }

    .act-tag {
      display: inline-block;
      font-weight: 800;
      font-size: 0.75rem;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.15);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

<div class="motor-container">
  <div class="header">
    <span class="badge">CAMADA 4 • MOTOR DWELL TIME</span>
    <h1>Gerador de Novela de Dor (3 Atos)</h1>
    <p class="desc">Algoritmo de Retenção Psicológica (>40s) para Quora, Reddit e Fóruns com Clímax Interrompido.</p>
  </div>

  <div class="form-group">
    <label for="nicho">1. Nicho / Dor Específica (Ex: Dor ciática incapacitante, Linhas de expressão profundas):</label>
    <input type="text" id="nicho" class="input-field" placeholder="Qual o problema visceral da pessoa?">
  </div>

  <div class="form-group">
    <label for="inimigo">2. Causa Oculta / O Que a Indústria Esconde (Ex: A farsa dos remédios convencionais, O colágeno industrial que o corpo rejeita):</label>
    <input type="text" id="inimigo" class="input-field" placeholder="Qual o inimigo ou erro comum que todos cometem?">
  </div>

  <div class="form-group">
    <label for="revelacao">3. A Descoberta / O Tratado Revelado (Ex: O protocolo de descompressão natural, O método das massagistas orientais):</label>
    <input type="text" id="revelacao" class="input-field" placeholder="O que resolveu ou o documento confidencial descoberto?">
  </div>

  <div class="form-group">
    <label for="linkGateway">4. Link do Gateway GitHub Pages (Destino Final):</label>
    <input type="text" id="linkGateway" class="input-field" placeholder="https://kingbrzil.github.io/shopee-gateways/gateway_exemplo.html">
  </div>

  <button class="btn-generate" onclick="executarMotor()">⚡ GERAR NOVELA DE RETENÇÃO (3 ATOS)</button>

  <div id="outputContainer" class="output-box">
    <div class="output-header">
      <span class="output-title">🔥 Copy Gerada para Alta Retenção & Clique Forçado</span>
      <button class="btn-copy" onclick="copiarCopy()">Copiar Texto</button>
    </div>
    <div id="copyOutput" class="copy-content"></div>
  </div>
</div>

<script>
  // LÓGICA ESTRITA DO CÉREBRO DWELL TIME (3 ATOS CHUMBADOS)
  function gerarPromptEstruturado(nicho, inimigo, revelacao, linkGateway) {
    return `Atue como um membro veterano do Quora contando uma experiência real, crua e perturbadora. 
Sua missão é maximizar o DWELL TIME (tempo de leitura na página acima de 45 segundos) e forçar o leitor a clicar no link fornecido usando a técnica do Clímax Interrompido.

Siga rigorosamente a ESTRUTURA DOS 3 ATOS:

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[ATO 1: O GANCHO BRUTAL / ABERTURA CHOCANTE]
- Comece no meio da ação (in media res) ou com uma denúncia perturbadora sobre ${nicho}.
- Primeira linha deve paralisar a rolagem imediatamente: "Se você sofre com ${nicho}, pare o que está fazendo antes que cometa o mesmo erro que destruiu minha rotina..."
- Revele a verdade que a indústria esconde: ${inimigo}.
- Use frases curtas, viscerais, sem jargões de marketing.

[ATO 2: A RETENÇÃO DENSA / O MERGULHO PROFUNDO (>40 SEGUNDOS)]
- Entregue uma explicação detalhada, densa e fascinante sobre por que nada funcionava.
- Conecte explicações fisiológicas/lógicas de fácil entendimento que prendam a atenção segundo a segundo.
- Mostre o ponto de virada: como você teve acesso acidental a um documento/tratado confidencial (${revelacao}).
- Construa uma tensão crescente: o leitor precisa sentir que está diante de um segredo proibido.

[ATO 3: O CLÍMAX INTERROMPIDO / CLIFFHANGER BRUTAL]
- O TEXTO NÃO PODE TER UM FINAL FELIZ OU CONCLUSÃO DIRETA AQUI.
- No exato momento em que você vai explicar o passo a passo ou o composto exato, CORTE O TEXTO ABRUPTAMENTE:
  "...quando cheguei na página 12 do protocolo e vi exatamente a combinação de 3 elementos que nenhum especialista revela, tudo fez sentido. 
  Não posso postar o método completo aqui porque as diretrizes do Quora já derrubaram meu post anterior duas vezes por 'violação de patentes industriais'. 
  Subi o Tratado Oficial completo e o arquivo original diretamente no repositório sem censura para quem realmente precisa:
  👉 Acesse o Protocolo Original Completo aqui: ${linkGateway}"
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

REGRAS OBRIGATÓRIAS:
1. Tom: Pessoal, urgente, anti-sistema, 100% autêntico.
2. Nunca soe como vendedor. Você é alguém vazando uma verdade proibida.
3. Termine imediatamente após a inserção do link no Ato 3.`;
  }

  async function executarMotor() {
    const nicho = document.getElementById('nicho').value.trim();
    const inimigo = document.getElementById('inimigo').value.trim();
    const revelacao = document.getElementById('revelacao').value.trim();
    const linkGateway = document.getElementById('linkGateway').value.trim() || "https://kingbrzil.github.io/shopee-gateways/gateway_dores_articulacoes.html";
    const btn = document.querySelector('.btn-generate');
    const outputContainer = document.getElementById('outputContainer');
    const copyOutput = document.getElementById('copyOutput');

    if (!nicho) {
      alert("Por favor, preencha ao menos o Nicho / Dor Principal.");
      return;
    }

    btn.innerText = "SINTETIZANDO NOVELA EM 3 ATOS...";
    btn.disabled = true;
    outputContainer.style.display = "block";
    copyOutput.innerHTML = "<em>Processando os 3 atos de retenção psicológica...</em>";

    // O Prompt Mestre injetado
    const promptFinal = gerarPromptEstruturado(nicho, inimigo || "a farsa dos tratamentos comuns", revelacao || "o manual confidencial esquecido", linkGateway);

    // Motor de Síntese Local Instantânea (Fallback inteligente que monta a cópia perfeita imediatamente)
    setTimeout(() => {
      const copyMontada = `Se você ainda sofre com ${nicho}, pare o que está fazendo por 2 minutos antes que cometa o mesmo erro que quase acabou comigo.

O que a indústria e os tratamentos convencionais nunca vão te dizer é que ${inimigo || "eles lucram com o seu sintoma, não com a sua cura definitiva"}. Durante anos, gastei rios de dinheiro tentando métodos tradicionais que só mascaravam o problema enquanto minha situação piorava dia após dia.

A verdade é que existe um mecanismo biológico simples que foi completamente esquecido. Quando você entende como ${nicho} realmente se desenvolve no organismo, você percebe que 99% das coisas que nos ensinam estão invertidas. Eu estava no fundo do poço, sem conseguir dormir direito, quando tive acesso por acaso a um relatório confidencial: ${revelacao || "o tratado completo de restauração profunda"}.

A explicação técnica era assustadoramente lógica. Diferente de tudo o que vendem por aí, o segredo não está em soluções mágicas ou químicas agressivas, mas sim em reativar a resposta natural do próprio corpo através de 3 etapas sequenciais específicas.

No entanto, quando cheguei na página 14 do documento e vi o protocolo exato de aplicação diária, percebi porque isso nunca chegou à grande mídia...

Não posso postar o passo a passo completo aqui porque as diretrizes do fórum já censuraram esse relato por "conflito com protocolos comerciais". Por garantia, subi o Tratado Oficial completo e o arquivo original diretamente no repositório seguro para quem precisa:

👉 Acesse o Documento Oficial Desbloqueado aqui: ${linkGateway}`;

      copyOutput.innerText = copyMontada;
      btn.innerText = "⚡ GERAR NOVELA DE RETENÇÃO (3 ATOS)";
      btn.disabled = false;
    }, 1000);
  }

  function copiarCopy() {
    const text = document.getElementById('copyOutput').innerText;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.btn-copy');
      btn.innerText = "✅ Copiado!";
      setTimeout(() => btn.innerText = "Copiar Texto", 2000);
    });
  }
</script>

</body>
</html>
