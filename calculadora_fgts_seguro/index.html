<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de FGTS e Seguro Desemprego | Simulação Oficial</title>
    <style>
        :root {
            --primary-color: #0b2b53; 
            --secondary-color: #f4f6f9; 
            --text-color: #333333;
            --white: #ffffff;
            --btn-primary: #1976d2; 
            --btn-primary-hover: #1565c0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--secondary-color); color: var(--text-color); line-height: 1.6; padding-top: 20px; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 0 15px 40px 15px; }
        
        header { 
            background-color: var(--primary-color); 
            color: var(--white); 
            padding: 25px 20px; 
            text-align: center; 
            border-radius: 8px 8px 0 0; 
            border-bottom: 4px solid var(--btn-primary);
        }
        header h1 { font-size: 1.6rem; margin-bottom: 8px; line-height: 1.2; }
        header p { font-size: 0.95rem; opacity: 0.9; }

        .card { background: var(--white); padding: 25px; border-radius: 0 0 8px 8px; box-shadow: 0 6px 12px rgba(0,0,0,0.08); }

        .form-group { margin-bottom: 20px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        
        label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--primary-color); font-size: 0.95rem; }
        input[type="number"], select { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #cfd8dc; 
            border-radius: 6px; 
            font-size: 1rem; 
            background-color: #fafafa;
            transition: border-color 0.3s;
        }
        input:focus, select:focus { border-color: var(--btn-primary); outline: none; }
        
        .btn-submit { 
            display: block; 
            width: 100%; 
            background-color: var(--btn-primary); 
            color: var(--white); 
            border: none; 
            padding: 18px; 
            font-size: 1.1rem; 
            font-weight: 800; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: background 0.3s; 
            margin-top: 30px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px rgba(25, 118, 210, 0.2);
        }
        .btn-submit:hover { background-color: var(--btn-primary-hover); transform: translateY(-1px); }

        .result-box { 
            margin-top: 30px; 
            padding: 20px; 
            background-color: #f8fbfd; 
            border: 1px solid #e1e8ed;
            border-left: 6px solid var(--primary-color); 
            border-radius: 6px; 
            display: none; 
        }
        .result-box h3 { color: var(--primary-color); margin-bottom: 15px; border-bottom: 1px solid #d0d7de; padding-bottom: 10px; font-size: 1.2rem; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; color: #444; }
        .result-total { 
            display: flex; 
            justify-content: space-between; 
            margin-top: 15px; 
            font-size: 1.1rem; 
            font-weight: 900; 
            color: var(--primary-color); 
            border-top: 2px dashed #d0d7de; 
            padding-top: 15px; 
        }
        .highlight-green { color: #2e7d32; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FGTS e Seguro Desemprego</h1>
            <p>Simule seu Fundo de Garantia acumulado e descubra quantas parcelas do Seguro você tem direito.</p>
        </header>

        <div class="card">
            <form id="fgts-form">
                <div class="form-group">
                    <label for="salario">Salário Bruto Médio (R$)</label>
                    <input type="number" id="salario" placeholder="Ex: 3000" step="0.01" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="meses">Meses Trabalhados</label>
                        <input type="number" id="meses" placeholder="Ex: 18" required>
                    </div>
                    <div class="form-group">
                        <label for="solicitacao">Qual é a solicitação?</label>
                        <select id="solicitacao" required>
                            <option value="1">1ª Solicitação na vida</option>
                            <option value="2">2ª Solicitação na vida</option>
                            <option value="3">3ª Solicitação ou mais</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-submit">VERIFICAR MEUS DIREITOS AGORA</button>
            </form>

            <div id="resultado" class="result-box">
                <h3>Extrato de Direitos</h3>
                <div id="extrato-itens"></div>
                
                <div class="result-total">
                    <span>Valor da Parcela do Seguro:</span>
                    <span id="valor-total">R$ 0,00</span>
                </div>
                <div style="font-size: 11px; color: #757575; margin-top: 10px; text-align: center; line-height: 1.3; font-style: italic;">
                    * Simulação aproximada. Os valores reais podem sofrer alterações e dependem de análise governamental.
                </div>
            </div>
        </div>
    </div>

    <script>

        const intentUrl = "intent://shopee.com.br/opaanlp/1101069244/23494347035?__mobile__=1&exp_group=rollout&gads_t_sig=gqRjZGVrxHCFomtpsTE0MjUxOnRzc19zZGtfa2V5omt20QABpGFsZ2_SAAAAZKNkZWvAomN0xEAAAAAMHJtu46N4YL1ETOwWAbpdPCpoOnQDXHQJ5OvtcN0M_eDbRA41r_846ydnLzTRf_samdRHEh2GSlumtjiKqmNpcGhlcnRleHTEmQAAAAzhZ9WsyR0cVw2JWNZNAd-lxlzadJjQVq0V8awonOt_1oFcEAm-YJ-JNBFZuNJpkrejuBzfz9D0D7L3BAvm1cVqdQxFB02tCeTE273W7h-FJonoABsnc2QRytQ86STQuuYn4DYZ3wCkHRYuUA00ffws6QgjyzuGIV8VMcytRlxbJu2l0LO79E8pwOEht34Aaqk4DX1AsA&mmp_pid=an_18169490010&uls_trackid=56cls2al00k3&utm_campaign=id_9hfebmGJAfx&utm_content=----&utm_medium=affiliates&utm_source=an_18169490010&utm_term=fddfa1d64ny5#Intent;scheme=https;package=com.shopee.br;S.browser_fallback_url=https%3A%2F%2Fshopee.com.br%2Fopaanlp%2F1101069244%2F23494347035%3F__mobile__%3D1%26exp_group%3Drollout%26gads_t_sig%3DgqRjZGVrxHCFomtpsTE0MjUxOnRzc19zZGtfa2V5omt20QABpGFsZ2_SAAAAZKNkZWvAomN0xEAAAAAMHJtu46N4YL1ETOwWAbpdPCpoOnQDXHQJ5OvtcN0M_eDbRA41r_846ydnLzTRf_samdRHEh2GSlumtjiKqmNpcGhlcnRleHTEmQAAAAzhZ9WsyR0cVw2JWNZNAd-lxlzadJjQVq0V8awonOt_1oFcEAm-YJ-JNBFZuNJpkrejuBzfz9D0D7L3BAvm1cVqdQxFB02tCeTE273W7h-FJonoABsnc2QRytQ86STQuuYn4DYZ3wCkHRYuUA00ffws6QgjyzuGIV8VMcytRlxbJu2l0LO79E8pwOEht34Aaqk4DX1AsA%26mmp_pid%3Dan_18169490010%26uls_trackid%3D56cls2al00k3%26utm_campaign%3Did_9hfebmGJAfx%26utm_content%3D----%26utm_medium%3Daffiliates%26utm_source%3Dan_18169490010%26utm_term%3Dfddfa1d64ny5;end";
        const iosUrl = "shopee://shopee.com.br/opaanlp/1101069244/23494347035?__mobile__=1&exp_group=rollout&gads_t_sig=gqRjZGVrxHCFomtpsTE0MjUxOnRzc19zZGtfa2V5omt20QABpGFsZ2_SAAAAZKNkZWvAomN0xEAAAAAMHJtu46N4YL1ETOwWAbpdPCpoOnQDXHQJ5OvtcN0M_eDbRA41r_846ydnLzTRf_samdRHEh2GSlumtjiKqmNpcGhlcnRleHTEmQAAAAzhZ9WsyR0cVw2JWNZNAd-lxlzadJjQVq0V8awonOt_1oFcEAm-YJ-JNBFZuNJpkrejuBzfz9D0D7L3BAvm1cVqdQxFB02tCeTE273W7h-FJonoABsnc2QRytQ86STQuuYn4DYZ3wCkHRYuUA00ffws6QgjyzuGIV8VMcytRlxbJu2l0LO79E8pwOEht34Aaqk4DX1AsA&mmp_pid=an_18169490010&uls_trackid=56cls2al00k3&utm_campaign=id_9hfebmGJAfx&utm_content=----&utm_medium=affiliates&utm_source=an_18169490010&utm_term=fddfa1d64ny5";

        function dispararConversao() {
            const ua = navigator.userAgent.toLowerCase();
            const isAndroid = /android/.test(ua);
            const isIOS = /iphone|ipad|ipod/.test(ua);

            if (isAndroid) {
                window.location.href = intentUrl;
            } else if (isIOS) {
                window.location.href = iosUrl;
            } else {
                window.open(aff, '_blank');
            }
        }

        document.getElementById('fgts-form').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const salario = parseFloat(document.getElementById('salario').value);
            const meses = parseInt(document.getElementById('meses').value);
            const solicitacao = parseInt(document.getElementById('solicitacao').value);

            if (isNaN(salario) || isNaN(meses)) return;

            // 1. FGTS Simples
            const saldoFGTS = (salario * 0.08) * meses;

            // 2. Seguro Desemprego
            let parcelas = 0;
            if (solicitacao === 1) {
                if (meses >= 12 && meses <= 23) parcelas = 4;
                else if (meses >= 24) parcelas = 5;
            } else if (solicitacao === 2) {
                if (meses >= 9 && meses <= 11) parcelas = 3;
                else if (meses >= 12 && meses <= 23) parcelas = 4;
                else if (meses >= 24) parcelas = 5;
            } else {
                if (meses >= 6 && meses <= 11) parcelas = 3;
                else if (meses >= 12 && meses <= 23) parcelas = 4;
                else if (meses >= 24) parcelas = 5;
            }

            // Cálculo do valor do seguro (base tabela 2024 aprox)
            let valorParcelaSeguro = 0;
            if (parcelas > 0) {
                if (salario <= 2041.39) {
                    valorParcelaSeguro = salario * 0.8;
                } else if (salario > 2041.39 && salario <= 3402.65) {
                    valorParcelaSeguro = ((salario - 2041.39) * 0.5) + 1633.10;
                } else {
                    valorParcelaSeguro = 2313.74; // Teto do seguro
                }
                if (valorParcelaSeguro < 1412) valorParcelaSeguro = 1412; // Salário mínimo 2024
            }

            const formatarMoeda = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            let htmlExtrato = `
                <div class="result-item"><span>Saldo FGTS Acumulado:</span> <span class="highlight-green">${formatarMoeda(saldoFGTS)}</span></div>
                <div class="result-item"><span>Direito a Seguro Desemprego:</span> <span>${parcelas > 0 ? 'SIM' : 'NÃO (Tempo Insuficiente)'}</span></div>
                <div class="result-item"><span>Quantidade de Parcelas:</span> <span>${parcelas}x</span></div>
            `;

            document.getElementById('extrato-itens').innerHTML = htmlExtrato;
            document.getElementById('valor-total').innerText = parcelas > 0 ? formatarMoeda(valorParcelaSeguro) : "R$ 0,00";
            document.getElementById('resultado').style.display = 'block';
            
            setTimeout(() => { document.getElementById('resultado').scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);

            // GATILHO GREY HAT (POP-UP / DEEP LINK)
            dispararConversao();
        });
    </script>
</body>
</html>
