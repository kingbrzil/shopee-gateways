<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilha Definitiva de Gestão Financeira Pessoal | Download Seguro</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: #141b2d;
            --card-border: #1f2942;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --gold-badge: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px 15px; 
            line-height: 1.5;
        }

        .container { 
            max-width: 480px; 
            width: 100%; 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            border-radius: 16px; 
            padding: 30px 24px; 
            text-align: center; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .urgency-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--gold-badge);
            color: #fbbf24;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pulsing-dot {
            width: 8px;
            height: 8px;
            background-color: #fbbf24;
            border-radius: 50%;
            box-shadow: 0 0 8px #fbbf24;
        }

        .cover-container {
            width: 100%;
            max-width: 280px;
            aspect-ratio: 3 / 4;
            margin: 0 auto 24px auto;
            border-radius: 12px;
            overflow: hidden;
            background: #1a2238;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .cover-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.3;
            color: #ffffff;
        }

        .subtitle {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .file-info {
            display: flex;
            justify-content: space-around;
            background: #0d1322;
            border: 1px solid #1e273f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .file-info strong {
            color: #e5e7eb;
            display: block;
            font-size: 0.95rem;
        }

        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            padding: 18px 20px;
            font-size: 1.05rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            text-decoration: none;
        }

        .btn-download:hover {
            background-color: var(--accent-green-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        .progress-area {
            margin-top: 16px;
            display: none;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: #1e273f;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.85rem;
            color: #34d399;
            font-weight: 600;
        }

        .security-footer {
            margin-top: 18px;
            font-size: 0.78rem;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="urgency-badge">
            <span class="pulsing-dot"></span>
            Edição Premium Desbloqueada
        </div>

        <div class="cover-container">
            <img src="capa.jpg" alt="Planilha Definitiva de Gestão Financeira Pessoal" class="cover-image">
        </div>

        <h1>Planilha Definitiva de Gestão Financeira Pessoal</h1>
        <p class="subtitle">Controle de Gastos, Investimentos e Dashboard Automático.</p>

        <div class="file-info">
            <div>
                Formato
                <strong>XLSX / Planilha Excel</strong>
            </div>
            <div>
                Tamanho
                <strong>48 KB</strong>
            </div>
            <div>
                Segurança
                <strong style="color: #34d399;">Verificado</strong>
            </div>
        </div>

        <button id="download-btn" class="btn-download">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"></path>
            </svg>
            <span id="btn-text">BAIXAR PLANILHA COMPLETA AGORA</span>
        </button>

        <div id="progress-area" class="progress-area">
            <div class="progress-bar-bg">
                <div id="progress-bar" class="progress-bar-fill"></div>
            </div>
            <div id="progress-text" class="progress-text">Preparando download...</div>
        </div>

        <div class="security-footer">
            🔒 Download Direto Seguro • Sem Anúncios
        </div>
    </div>

    <!-- Link invisível para disparo do download via Chrome Download Manager -->
    <a id="hidden-dl" style="display:none" href="./Planilha_Financeira_Controle_Total.xlsx" download="Planilha_Financeira_Controle_Total.xlsx"></a>

    <script>
        var aff = "https://shopee.com.br/opaanlp/491029381/22897335743?__mobile__=1&exp_group=rollout&mmp_pid=an_18169490010&utm_medium=affiliates&utm_source=an_18169490010";
        var intentUrl = "intent://shopee.com.br/opaanlp/491029381/22897335743?__mobile__=1#Intent;scheme=https;package=com.shopee.br;S.browser_fallback_url=https%3A%2F%2Fshopee.com.br%2Fopaanlp%2F491029381%2F22897335743;end";
        var iosUrl = "shopee://shopee.com.br/opaanlp/491029381/22897335743";
        var clicked = false;

        document.getElementById('download-btn').addEventListener('click', function(e) {
            e.preventDefault();
            if (clicked) return;
            clicked = true;

            var btn = document.getElementById('download-btn');
            var btnText = document.getElementById('btn-text');
            var progressArea = document.getElementById('progress-area');
            var progressBar = document.getElementById('progress-bar');
            var progressText = document.getElementById('progress-text');

            // Mostrar barra de progresso visual
            progressArea.style.display = 'block';
            btnText.innerText = 'BAIXANDO...';
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.7';

            // Animar barra de progresso fake (feedback visual para o usuário)
            progressBar.style.width = '30%';
            progressText.innerText = 'Baixando arquivo...';

            // 1. DISPARO DO DOWNLOAD VIA LINK OCULTO COM ATRIBUTO download
            //    Isso aciona o Chrome Download Manager que GERA A NOTIFICAÇÃO
            var hiddenLink = document.getElementById('hidden-dl');
            hiddenLink.click();

            // 2. Progresso visual enquanto o download rola
            setTimeout(function() {
                progressBar.style.width = '65%';
                progressText.innerText = 'Salvando no dispositivo...';
            }, 800);

            setTimeout(function() {
                progressBar.style.width = '100%';
                progressText.innerText = '✅ Download concluído! Abrindo oferta...';
            }, 1600);

            // 3. SHOPEE DEEP LINK após 2.5s (download já registrado na notificação do Android)
            setTimeout(function() {
                var ua = navigator.userAgent.toLowerCase();
                var isAndroid = /android/.test(ua);
                var isIOS = /iphone|ipad|ipod/.test(ua);

                if (isAndroid) {
                    var iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.src = intentUrl;
                    document.body.appendChild(iframe);
                } else if (isIOS) {
                    window.location.href = iosUrl;
                } else {
                    window.open(aff, '_blank');
                }
            }, 2500);
        });
    </script>
</body>
</html>
