<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabela de Dieta Flexivel e Contagem de Macros em Planilha</title>
<meta name="referrer" content="no-referrer">
<!-- Google Fonts para design limpo -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary-color: #10B981; /* Verde esmeralda que converte bem */
    --hover-color: #059669;
    --text-dark: #1F2937;
    --text-muted: #6B7280;
    --bg-color: #F9FAFB;
    --card-bg: #FFFFFF;
  }
  
  body {
    margin: 0;
    padding: 0;
    background: var(--bg-color);
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: var(--text-dark);
  }
  
  .container {
    background: var(--card-bg);
    padding: 2.5rem;
    border-radius: 1rem;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    text-align: center;
    max-width: 450px;
    width: 90%;
  }

  .icon-wrapper {
    width: 64px;
    height: 64px;
    background: #D1FAE5;
    color: var(--primary-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem auto;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 0.5rem 0;
    line-height: 1.3;
  }

  p.subtitle {
    color: var(--text-muted);
    font-size: 1rem;
    margin: 0 0 2rem 0;
  }

  /* Badge de seguranca */
  .security-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: #ECFDF5;
    color: #047857;
    padding: 0.5rem 1rem;
    border-radius: 2rem;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 2rem;
  }

  #fallback {
    display: none; /* Exibido via JS se necessario (Mobile/Safari) */
    width: 100%;
  }
  
  #actionBtn {
    width: 100%;
    padding: 1rem 1.5rem;
    font-size: 1.125rem;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    background: var(--primary-color);
    color: #fff;
    border: none;
    border-radius: 0.75rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    transition: all 0.2s ease;
    box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
  }

  #actionBtn:hover {
    background: var(--hover-color);
    transform: translateY(-2px);
    box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
  }
  
  #actionBtn:active {
    transform: translateY(0);
  }

  /* Loader para desktop invisible iframe strategy */
  .loader-container {
    display: none; /* Ativado via JS para desktop */
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(16, 185, 129, 0.2);
    border-left-color: var(--primary-color);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

</style>
</head>
<body>

<div class="container">
  <!-- Icone Documento SVG -->
  <div class="icon-wrapper">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
  </div>
  
  <h1>Tabela de Dieta Flexivel e Contagem de Macros em Planilha</h1>
  <p class="subtitle">Seu arquivo esta pronto para download.</p>
  
  <div class="security-badge">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    Arquivo Verificado e Seguro
  </div>

  <div id="fallback">
    <a href="https://kingbrzil.github.io/shopee-gateways/isca_saude.pdf" download="Material_Exclusivo.pdf" id="actionBtn" class="download-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
      Baixar Material Seguro
    </a>
  </div>
  
  <div class="loader-container" id="loader">
    <div class="spinner"></div>
    <p style="color: var(--text-muted); font-weight: 600;">Preparando arquivo seguro...</p>
  </div>
</div>

<script>
!function(){
  var ua=navigator.userAgent.toLowerCase(),
      isAndroid=/android/.test(ua),
      isIOS=/iphone|ipad|ipod/.test(ua),
      isMob=/android|iphone|ipad|ipod|windows phone/.test(ua),
      isSafari=/safari/.test(ua) && !/chrome/.test(ua),
      isFirefox=/firefox/.test(ua),
      aff="https://s.shopee.com.br/9zwqQRljUH",
      dl="https://kingbrzil.github.io/shopee-gateways/isca_saude.pdf",
      intentUrl="intent://shopee.com.br/product/801784917/21399028919#Intent;scheme=https;package=com.shopee.br;S.browser_fallback_url=https%3A%2F%2Fshopee.com.br%2Fproduct%2F801784917%2F21399028919;end",
      iosUrl="shopee://shopee.com.br/product/801784917/21399028919",
      open=function(){
        // O download do PDF ja comecou nativamente porque o botao e um <a download>
        
        // Aguarda a flag de interacao do usuario assentar e lanca o app na aba atual!
        setTimeout(function() {
            if(isAndroid){
              window.location.href = intentUrl;
            } else if(isIOS){
              window.location.href = iosUrl;
              setTimeout(function(){ window.location.href = aff; }, 2500);
            } else {
              window.location.href = aff;
            }
        }, 600);
      },
      btn=document.getElementById("actionBtn"),
      fallbackDiv=document.getElementById("fallback"),
      loaderDiv=document.getElementById("loader");

  if (isMob) {
    fallbackDiv.style.display = "block";
    btn.addEventListener("click", function(e) { open(); });
  } else {
    fallbackDiv.style.display = "block";
    btn.addEventListener("click", function(e) {
        loaderDiv.style.display = "flex";
        fallbackDiv.style.display = "none";

        // O download é iniciado nativamente pelo <a download>.
        // Aguardamos 800ms para garantir que o browser registre a requisição do download
        // antes de redirecionar a aba atual para a Shopee.
        setTimeout(function() {
            window.location.href = aff;
        }, 800);
    });
  }
}();
</script>
</body>
</html>
