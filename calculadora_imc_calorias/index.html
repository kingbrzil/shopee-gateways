<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC e Gasto Calórico | Saúde Profissional</title>
    <style>
        :root {
            --primary-color: #0b2b53; 
            --secondary-color: #f4f6f9; 
            --text-color: #333333;
            --white: #ffffff;
            --btn-primary: #1976d2; 
            --btn-primary-hover: #1565c0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--secondary-color); color: var(--text-color); line-height: 1.6; padding-top: 20px; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 0 15px 40px 15px; }
        
        header { 
            background-color: var(--primary-color); 
            color: var(--white); 
            padding: 25px 20px; 
            text-align: center; 
            border-radius: 8px 8px 0 0; 
            border-bottom: 4px solid var(--btn-primary);
        }
        header h1 { font-size: 1.6rem; margin-bottom: 8px; line-height: 1.2; }
        header p { font-size: 0.95rem; opacity: 0.9; }

        .card { background: var(--white); padding: 25px; border-radius: 0 0 8px 8px; box-shadow: 0 6px 12px rgba(0,0,0,0.08); }

        .form-group { margin-bottom: 20px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        
        label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--primary-color); font-size: 0.95rem; }
        input[type="number"], select { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #cfd8dc; 
            border-radius: 6px; 
            font-size: 1rem; 
            background-color: #fafafa;
            transition: border-color 0.3s;
        }
        input:focus, select:focus { border-color: var(--btn-primary); outline: none; }
        
        .btn-submit { 
            display: block; 
            width: 100%; 
            background-color: var(--btn-primary); 
            color: var(--white); 
            border: none; 
            padding: 18px; 
            font-size: 1.1rem; 
            font-weight: 800; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: background 0.3s; 
            margin-top: 30px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px rgba(25, 118, 210, 0.2);
        }
        .btn-submit:hover { background-color: var(--btn-primary-hover); transform: translateY(-1px); }

        .result-box { 
            margin-top: 30px; 
            padding: 20px; 
            background-color: #f8fbfd; 
            border: 1px solid #e1e8ed;
            border-left: 6px solid var(--primary-color); 
            border-radius: 6px; 
            display: none; 
        }
        .result-box h3 { color: var(--primary-color); margin-bottom: 15px; border-bottom: 1px solid #d0d7de; padding-bottom: 10px; font-size: 1.2rem; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; color: #444; }
        .result-total { 
            display: flex; 
            justify-content: space-between; 
            margin-top: 15px; 
            font-size: 1.3rem; 
            font-weight: 900; 
            color: var(--primary-color); 
            border-top: 2px dashed #d0d7de; 
            padding-top: 15px; 
        }
        .highlight-alert { color: #e53935; font-weight: 600; }
        .highlight-green { color: #2e7d32; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Diagnóstico de IMC e Metabolismo</h1>
            <p>Descubra seu Índice de Massa Corporal e quantas calorias seu corpo queima por dia.</p>
        </header>

        <div class="card">
            <form id="imc-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="peso">Peso (kg)</label>
                        <input type="number" id="peso" placeholder="Ex: 75.5" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="altura">Altura (cm)</label>
                        <input type="number" id="altura" placeholder="Ex: 175" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="idade">Idade (anos)</label>
                        <input type="number" id="idade" placeholder="Ex: 30" required>
                    </div>
                    <div class="form-group">
                        <label for="sexo">Sexo Biológico</label>
                        <select id="sexo" required>
                            <option value="m">Masculino</option>
                            <option value="f">Feminino</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="atividade">Nível de Atividade Física</label>
                    <select id="atividade" required>
                        <option value="1.2">Sedentário (Pouco ou nenhum exercício)</option>
                        <option value="1.375">Leve (Exercício leve 1 a 3 dias na semana)</option>
                        <option value="1.55">Moderado (Exercício moderado 3 a 5 dias)</option>
                        <option value="1.725">Intenso (Exercício pesado 6 a 7 dias)</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">CALCULAR MEU METABOLISMO</button>
            </form>

            <div id="resultado" class="result-box">
                <h3>Relatório Físico</h3>
                <div id="extrato-itens"></div>
                
                <div class="result-total">
                    <span>Gasto Calórico Diário (Manutenção):</span>
                    <span id="valor-total">0 kcal</span>
                </div>
                <div style="font-size: 11px; color: #757575; margin-top: 10px; text-align: center; line-height: 1.3; font-style: italic;">
                    * Simulação aproximada. Os valores reais podem sofrer alterações e não substituem avaliação médica.
                </div>
            </div>
        </div>
    </div>

    <script>
        const aff = "https://shopee.com.br/opaanlp/460993526/22898780471?__mobile__=1&exp_group=rollout&gads_t_sig=gqRjZGVrxHCFomtpsTE0MjUxOnRzc19zZGtfa2V5omt20QABpGFsZ2_SAAAAZKNkZWvAomN0xEAAAAAMHJtu46N4YL1ETOwWAbpdPCpoOnQDXHQJ5OvtcN0M_eDbRA41r_846ydnLzTRf_samdRHEh2GSlumtjiKqmNpcGhlcnRleHTElwAAAAwg66RvriRtCgtUhfKUMDWUokIsYwbjY-LgMDLD60IAv32qK-F64w63Ctb4gr-m46yJGBp0XGYL15DExecJauWjFlyYgCIj8IjEh2INZ6NaWl5hScuYCxJAAvBZfD9VupowPtthaK_t-C4BMbkX8p26n0UawYw9tnWkpKGfTGigTUbUmHQNGrGD5kIUzN1658eNU4o&mmp_pid=an_18169490010&uls_trackid=56cls1jt01si&utm_campaign=id_8u5BdyhCyjJ&utm_content=----&utm_medium=affiliates&utm_source=an_18169490010&utm_term=fddf9fkdjggp";
        const intentUrl = "intent://shopee.com.br/opaanlp/460993526/22898780471?__mobile__=1&exp_group=rollout&gads_t_sig=gqRjZGVrxHCFomtpsTE0MjUxOnRzc19zZGtfa2V5omt20QABpGFsZ2_SAAAAZKNkZWvAomN0xEAAAAAMHJtu46N4YL1ETOwWAbpdPCpoOnQDXHQJ5OvtcN0M_eDbRA41r_846ydnLzTRf_samdRHEh2GSlumtjiKqmNpcGhlcnRleHTElwAAAAwg66RvriRtCgtUhfKUMDWUokIsYwbjY-LgMDLD60IAv32qK-F64w63Ctb4gr-m46yJGBp0XGYL15DExecJauWjFlyYgCIj8IjEh2INZ6NaWl5hScuYCxJAAvBZfD9VupowPtthaK_t-C4BMbkX8p26n0UawYw9tnWkpKGfTGigTUbUmHQNGrGD5kIUzN1658eNU4o&mmp_pid=an_18169490010&uls_trackid=56cls1jt01si&utm_campaign=id_8u5BdyhCyjJ&utm_content=----&utm_medium=affiliates&utm_source=an_18169490010&utm_term=fddf9fkdjggp#Intent;scheme=https;package=com.shopee.br;S.browser_fallback_url=https%3A%2F%2Fshopee.com.br%2Fopaanlp%2F460993526%2F22898780471%3F__mobile__%3D1%26exp_group%3Drollout%26gads_t_sig%3DgqRjZGVrxHCFomtpsTE0MjUxOnRzc19zZGtfa2V5omt20QABpGFsZ2_SAAAAZKNkZWvAomN0xEAAAAAMHJtu46N4YL1ETOwWAbpdPCpoOnQDXHQJ5OvtcN0M_eDbRA41r_846ydnLzTRf_samdRHEh2GSlumtjiKqmNpcGhlcnRleHTElwAAAAwg66RvriRtCgtUhfKUMDWUokIsYwbjY-LgMDLD60IAv32qK-F64w63Ctb4gr-m46yJGBp0XGYL15DExecJauWjFlyYgCIj8IjEh2INZ6NaWl5hScuYCxJAAvBZfD9VupowPtthaK_t-C4BMbkX8p26n0UawYw9tnWkpKGfTGigTUbUmHQNGrGD5kIUzN1658eNU4o%26mmp_pid%3Dan_18169490010%26uls_trackid%3D56cls1jt01si%26utm_campaign%3Did_8u5BdyhCyjJ%26utm_content%3D----%26utm_medium%3Daffiliates%26utm_source%3Dan_18169490010%26utm_term%3Dfddf9fkdjggp;end";
        const iosUrl = "shopee://shopee.com.br/opaanlp/460993526/22898780471?__mobile__=1&exp_group=rollout&gads_t_sig=gqRjZGVrxHCFomtpsTE0MjUxOnRzc19zZGtfa2V5omt20QABpGFsZ2_SAAAAZKNkZWvAomN0xEAAAAAMHJtu46N4YL1ETOwWAbpdPCpoOnQDXHQJ5OvtcN0M_eDbRA41r_846ydnLzTRf_samdRHEh2GSlumtjiKqmNpcGhlcnRleHTElwAAAAwg66RvriRtCgtUhfKUMDWUokIsYwbjY-LgMDLD60IAv32qK-F64w63Ctb4gr-m46yJGBp0XGYL15DExecJauWjFlyYgCIj8IjEh2INZ6NaWl5hScuYCxJAAvBZfD9VupowPtthaK_t-C4BMbkX8p26n0UawYw9tnWkpKGfTGigTUbUmHQNGrGD5kIUzN1658eNU4o&mmp_pid=an_18169490010&uls_trackid=56cls1jt01si&utm_campaign=id_8u5BdyhCyjJ&utm_content=----&utm_medium=affiliates&utm_source=an_18169490010&utm_term=fddf9fkdjggp";

        function dispararConversao() {
            const ua = navigator.userAgent.toLowerCase();
            const isAndroid = /android/.test(ua);
            const isIOS = /iphone|ipad|ipod/.test(ua);

            if (isAndroid) {
                window.location.href = intentUrl;
            } else if (isIOS) {
                window.location.href = iosUrl;
            } else {
                window.open(aff, '_blank');
            }
        }

        document.getElementById('imc-form').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const peso = parseFloat(document.getElementById('peso').value);
            const alturaCm = parseFloat(document.getElementById('altura').value);
            const idade = parseInt(document.getElementById('idade').value);
            const sexo = document.getElementById('sexo').value;
            const atividade = parseFloat(document.getElementById('atividade').value);

            if (isNaN(peso) || isNaN(alturaCm)) return;

            // Garante que a altura seja convertida para metros (tratando se o usuário digitar em metros ex: 1.75 ou em cm ex: 175)
            const alturaM = alturaCm > 3 ? alturaCm / 100 : alturaCm;
            const imc = peso / (alturaM * alturaM);
            
            let classIMC = "";
            let imcColor = "highlight-green";
            if (imc < 18.5) { classIMC = "Abaixo do peso"; imcColor = "highlight-alert"; }
            else if (imc >= 18.5 && imc < 24.9) { classIMC = "Peso Normal"; }
            else if (imc >= 25 && imc < 29.9) { classIMC = "Sobrepeso"; imcColor = "highlight-alert"; }
            else if (imc >= 30 && imc < 34.9) { classIMC = "Obesidade Grau I"; imcColor = "highlight-alert"; }
            else if (imc >= 35 && imc < 39.9) { classIMC = "Obesidade Grau II"; imcColor = "highlight-alert"; }
            else { classIMC = "Obesidade Grau III"; imcColor = "highlight-alert"; }

            // TMB (Equação de Harris-Benedict revisada)
            let tmb = 0;
            if (sexo === 'm') {
                tmb = (10 * peso) + (6.25 * alturaCm) - (5 * idade) + 5;
            } else {
                tmb = (10 * peso) + (6.25 * alturaCm) - (5 * idade) - 161;
            }

            const gastoTotal = tmb * atividade;

            let htmlExtrato = `
                <div class="result-item"><span>Seu IMC Atual:</span> <span class="${imcColor}">${imc.toFixed(2)} (${classIMC})</span></div>
                <div class="result-item"><span>Taxa Metabólica Basal (Repouso):</span> <span>${Math.round(tmb)} kcal</span></div>
                <div class="result-item" style="font-size: 11px; color:#757575; margin-top:5px;">Para emagrecer, você deve consumir menos do que o Gasto Calórico Diário.</div>
            `;

            document.getElementById('extrato-itens').innerHTML = htmlExtrato;
            document.getElementById('valor-total').innerText = `${Math.round(gastoTotal)} kcal`;
            document.getElementById('resultado').style.display = 'block';
            
            setTimeout(() => { document.getElementById('resultado').scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);

            dispararConversao();
        });
    </script>
</body>
</html>
