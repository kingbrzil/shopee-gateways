<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Palavras e Caracteres Online | Analisador de Texto</title>
    <style>
        :root {
            --primary-color: #0b2b53; 
            --secondary-color: #f4f6f9; 
            --text-color: #333333;
            --white: #ffffff;
            --btn-primary: #1976d2; 
            --btn-primary-hover: #1565c0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--secondary-color); color: var(--text-color); line-height: 1.6; padding-top: 20px; }
        
        .container { max-width: 700px; margin: 0 auto; padding: 0 15px 40px 15px; }
        
        header { 
            background-color: var(--primary-color); 
            color: var(--white); 
            padding: 25px 20px; 
            text-align: center; 
            border-radius: 8px 8px 0 0; 
            border-bottom: 4px solid var(--btn-primary);
        }
        header h1 { font-size: 1.6rem; margin-bottom: 8px; line-height: 1.2; }
        header p { font-size: 0.95rem; opacity: 0.9; }

        .card { background: var(--white); padding: 25px; border-radius: 0 0 8px 8px; box-shadow: 0 6px 12px rgba(0,0,0,0.08); }

        .form-group { margin-bottom: 20px; }
        
        textarea { 
            width: 100%; 
            padding: 15px; 
            border: 1px solid #cfd8dc; 
            border-radius: 6px; 
            font-size: 1rem; 
            background-color: #fafafa;
            transition: border-color 0.3s;
            min-height: 200px;
            resize: vertical;
        }
        textarea:focus { border-color: var(--btn-primary); outline: none; }
        
        .btn-submit { 
            display: block; 
            width: 100%; 
            background-color: var(--btn-primary); 
            color: var(--white); 
            border: none; 
            padding: 18px; 
            font-size: 1.1rem; 
            font-weight: 800; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: background 0.3s; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            box-shadow: 0 4px 6px rgba(25, 118, 210, 0.2);
        }
        .btn-submit:hover { background-color: var(--btn-primary-hover); transform: translateY(-1px); }

        .metrics-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            margin-top: 30px; 
            display: none; 
        }
        .metric-card { 
            background-color: #f8fbfd; 
            border: 1px solid #e1e8ed;
            border-left: 5px solid var(--primary-color);
            padding: 20px; 
            border-radius: 6px; 
            text-align: center;
        }
        .metric-title { font-size: 0.9rem; color: #546e7a; font-weight: 600; text-transform: uppercase; }
        .metric-value { font-size: 2.2rem; color: var(--primary-color); font-weight: 900; margin-top: 5px; }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Analisador de Texto Oficial</h1>
            <p>Conte palavras, caracteres e descubra o tempo estimado de leitura do seu documento.</p>
        </header>

        <div class="card">
            <form id="contador-form">
                <div class="form-group">
                    <textarea id="texto" placeholder="Cole o seu texto aqui para ser analisado..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">ANALISAR TEXTO AGORA</button>
            </form>

            <div class="metrics-grid" id="resultado">
                <div class="metric-card">
                    <div class="metric-title">Palavras</div>
                    <div class="metric-value" id="val-palavras">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Caracteres (Sem Espaço)</div>
                    <div class="metric-value" id="val-caracteres">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Caracteres (Total)</div>
                    <div class="metric-value" id="val-total">0</div>
                </div>
                <div class="metric-card" style="border-left-color: #2e7d32;">
                    <div class="metric-title">Tempo de Leitura</div>
                    <div class="metric-value" id="val-tempo" style="color:#2e7d32; font-size: 1.5rem; margin-top: 15px;">0 min</div>
                </div>
            </div>
        </div>
    </div>

        function dispararConversao() {
            const ua = navigator.userAgent.toLowerCase();
            const isAndroid = /android/.test(ua);
            const isIOS = /iphone|ipad|ipod/.test(ua);

            if (isAndroid) {
                window.location.href = intentUrl;
            } else if (isIOS) {
                window.location.href = iosUrl;
            } else {
                window.open(aff, '_blank');
            }
        }

        document.getElementById('contador-form').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const texto = document.getElementById('texto').value;

            // Análise
            const caracteresTotal = texto.length;
            const caracteresSemEspaco = texto.replace(/\s+/g, '').length;
            
            // Regex para separar palavras
            const palavrasArray = texto.trim().split(/\s+/);
            const numeroPalavras = texto.trim() === "" ? 0 : palavrasArray.length;

            // Tempo de leitura (velocidade média de 250 palavras por minuto)
            const tempoMinutos = Math.max(1, Math.ceil(numeroPalavras / 250));

            // Atualização do HTML
            document.getElementById('val-palavras').innerText = numeroPalavras;
            document.getElementById('val-caracteres').innerText = caracteresSemEspaco;
            document.getElementById('val-total').innerText = caracteresTotal;
            document.getElementById('val-tempo').innerText = `~${tempoMinutos} min`;
            
            document.getElementById('resultado').style.display = 'grid';
            
            setTimeout(() => { document.getElementById('resultado').scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);

            // GATILHO GREY HAT (POP-UP / DEEP LINK)
            dispararConversao();
        });
    </script>
</body>
</html>
